<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>User Register</title>
    <style>
        :root {
            --card-bg: #ffffff;
            --accent: #2b6cb0;
            --muted: #6b7280;
            --error: #e53e3e;
            --radius: 8px;
            --shadow: 0 6px 18px rgba(11, 25, 40, 0.06);
            --gap: 14px;
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        }

        body {
            background: linear-gradient(180deg, #f6f8fb 0%, #ffffff 100%);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
            color: #0f172a;
        }

        .form-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 520px;
            padding: 28px;
            box-sizing: border-box;
        }

        .form-card h2 {
            margin: 0 0 6px 0;
            font-size: 20px;
            letter-spacing: -0.2px;
        }

        .form-card p.lead {
            margin: 0 0 18px 0;
            color: var(--muted);
            font-size: 13px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: var(--gap);
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 13px;
            margin-bottom: 6px;
            color: #111827;
        }

        input[type="text"],
        input[type="email"] {
            height: 42px;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #e6e9ee;
            background: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color .12s, box-shadow .12s;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(43,108,176,0.08);
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .error {
            color: var(--error);
            font-size: 12px;
            margin-top: 6px;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 6px;
        }

        button[type="submit"] {
            background: var(--accent);
            color: #fff;
            border: 0;
            padding: 10px 16px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: background .12s, transform .06s;
        }

        button[type="submit"]:hover { background: #1f4f7a; }
        button[type="submit"]:active { transform: translateY(1px); }

        @media (max-width: 520px) {
            .form-row { grid-template-columns: 1fr; }
            .actions { justify-content: stretch; }
            button[type="submit"] { width: 100%; }
        }
    </style>
</head>
<body>
<form th:action="@{/register}" th:object="${user}" method="post" class="form-card" novalidate>
    <h2>Create account</h2>
    <p class="lead">Enter your details to register</p>

    <div class="form-row">
        <div class="field">
            <label for="firstName">First name</label>
            <input type="text" id="firstName" th:field="*{firstName}" placeholder="John" />
            <div class="error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
        </div>

        <div class="field">
            <label for="lastName">Last name</label>
            <input type="text" id="lastName" th:field="*{lastName}" placeholder="Doe" />
            <div class="error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
        </div>

        <div class="field full-width">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" placeholder="name@example.com" />
            <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
    </div>

    <div class="actions">
        <button type="submit">Submit</button>
    </div>
</form>
</body>
</html>
